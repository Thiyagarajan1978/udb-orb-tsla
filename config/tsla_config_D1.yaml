# TSLA D1 (EXPERIMENTAL — NOT adopted): B1's engine with the "TRADE TASTIC" ATR TRAIL as the
# runner exit instead of the VWAP cross (enhancement atr_trail_exit). ONE line for both sides:
# TS = HHV(high - mult*ATR(5), 10), moving only on a closing, extending bar; the runner exits on
# the color flip — long when a bar CLOSES <= TS, short when it CLOSES > TS. Pine: v3.4 'D1'.
# (2026-07-23 SHORT-SIDE FIX: the first port mirrored an LLV(low+mult*ATR) line for shorts —
# no such line exists in the original; it exited 2026-07-23's short at 11:55 vs the true 10:35.)
# CORRECTED numbers (per unit, vs B1): 2024 +38.4 vs +20.2 | 2025 +72.2 vs +102.8 |
# 2026YTD +153.9 vs +138.0 -> 3yr ~tie (+264 vs +261). Kept for comparison; VWAP stays traded.
symbol: TSLA
timeframe_minutes: 5
timezone: America/New_York
execution:
  stop_fill_mode: close   # ADOPTED 2026-07-14: CLOSE-triggered stop (fires only when the bar CLOSES beyond the level, fills at the close). Beats wick/resting +46% net over 2022-2026, flips 2024 positive, cuts MaxDD ~40% (walk-forward OOS-confirmed on 2022-23). Avoids wick-fakeout stop-outs in chop years; TP stays wick-favorable.
  exit_on_close: true
  protective_stop: false
  daily_loss_limit: 0.0
session:
  rth_start: 09:30
  rth_end: '16:00'
  market_open: 09:30
  eod_exit: '15:50'
profile:
  name: Adaptive TP + Reversal (D1 ATR-Trail Runner)
  trade_qty: 1.0
  slippage_per_unit: 0.1
  use_breakout_buffer: true
  buffer_pct_or: 10.0
  sl_mode: Candle High/Low + Max Cap
  sl_offset: 0.0
  fixed_sl: 5.0
  tp_mode: Adaptive
  adaptive_tp_scale: 0.75  # ADOPTED 2026-08-20 for D1 (was 1.0). In D1 the adaptive TP takes no
                           # money -- its touch only ARMS the ATR trail -- so a shorter TP hands
                           # more trades to the chandelier instead of leaving them to the BE stop,
                           # which was 81% of all loss dollars at a 0% win rate. 2022-01-03..2026-08-11,
                           # one run split by exit year: net/unit 493.6 -> 529.0 (+7.2%), PF 1.30 ->
                           # 1.33, WR 44.9 -> 45.9, maxDD -86.3 -> -66.6 (-23%), net/maxDD +39%.
                           # POSITIVE ALL 5 YEARS. Cost is 2024: 56.0 -> 38.9 (chop year; every
                           # profile and every scale < 1.0 pays it). NOT fitted to the years it wins:
                           # on the 2024-25 window where this knob was originally tuned the column is
                           # flat and 0.90 wins; 0.75 wins on 2022-23 (never in any discovery set)
                           # and on 2026. The NET column is jagged +-0.05 -- treat 0.70-0.80 as the
                           # plateau; what is MONOTONE across 1.0->0.7, and therefore the trustworthy
                           # part, is drawdown and win rate. TradingView: set the D1 chart's
                           # "Adaptive TP - OR Width Multiplier" input to 0.75 (that input is GLOBAL
                           # in Pine, so it is a per-chart setting, not a re-paste).
  adaptive_tp_min: 2.14
  fixed_tp: 2.14
  use_be_retrace: true
  be_retrace_trigger: 0.55
  be_trail_amount: 0.25
  be_retrace_use_close: false
  use_partial_exit: true
  partial_qty_pct: 0.0     # DEFAULT since 2026-07-23 = "Full exit at ATR Trail" (Pine v3.6 D1 Exit
                           # mode): nothing off at the TP (its touch only ARMS the trail), 100% exits
                           # on the flip. Beats the 25% partial in ALL of 2024/25/26 (+39.7/+85.2/+179.0
                           # vs +38.4/+72.2/+162.3 per unit); 2025 worst day -13.6 vs -12.0.
                           # 25.0 = the original partial-then-trail D1. Forward test tracks THIS value.
  partial_activation: 1.0
  use_reversal: true
  reversal_qty_mult: 2.0
  reversal_target: 5.0
  apply_be_to_reversal: true
  reversal_risk_cap: 6.0
  reversal_risk_mode: scale
  min_or_width_enabled: false
  min_or_width: 2.5
  max_or_width_enabled: true
  max_or_width: 8.0
  use_vwap_filter: false
  trade_side_mode: Both
enhancements:
  atr_trail_exit:            # <- the one difference vs tsla_best_B.yaml
    enabled: true
    atr_period: 5
    hhv_period: 10
    mult: 2.5
    hybrid_vwap: false
  rvol_filter:
    enabled: false
    lookback_bars: 20
    min_rvol: 1.2
  volatility_regime:
    enabled: true
    lookback: 20
    max_rvol_pct: 4.92
  or_width_regime:
    enabled: false
    skip_below: 0.0
    skip_above: 0.0
  time_window:            # ADOPTED 2026-07-26 house-wide: no NEW entries (primary or reversal) after
    enabled: true         # 12:00 -- post-noon entries were a net-NEGATIVE cohort (lunch-hour chop).
    start: 09:35          # D1 TIGHTENED TO 11:30 on 2026-08-20 (this file only; A1/B1/C1/C2 stay
    end: '11:30'          # 12:00). The toxic pocket starts BEFORE noon: over 2022-01-03..2026-08-11
                          # the 11:30-12:00 entry cohort is 28 trades worth -19.4/unit (-0.69 each)
                          # and 11:00-11:30 is 40 trades at -8.6 (-0.22 each), while 10:30-11:00 is
                          # still POSITIVE (+4.6 over 62). 11:30 is where the cohort turns.
                          # With adaptive_tp_scale 0.75: net/unit 529.0 -> 548.5, PF 1.33 -> 1.36,
                          # maxDD -66.6 -> -55.0 (-17%), net/maxDD 7.94 -> 9.97 (BEST of every
                          # variant tested), positive all 5 years.
                          # WHY 11:30 AND NOT 11:00/10:30: it is the only cutoff that improves all
                          # three windows at once -- 2024-25 (the original fit window) 190.7->198.4,
                          # 2022-23 (never in any discovery set) 149.5->160.7, and 2026 (holdout)
                          # 188.8->189.3. 11:00 wins on net but gives back 2022-23 (148.9); 10:30
                          # gives back 2026 (185.2).
                          # HONEST LIMIT: the net gain is concentrated in 2022 (+21.3 of +19.4).
                          # Over the trailing 3 years it adds only +8.2/unit and on 2025-08..2026-08
                          # it is flat. The case rests on drawdown and on the cohort being
                          # mechanically negative, NOT on recent net. Pine 'Entry cutoff' input.
  reversal_capture:
    enabled: true
    trigger_on_be_stop: true
    trail_to_eod: true
    target_or_mult: 0.0
    reenter_after_whipsaw: false
  runner_trail:
    enabled: false
    or_mult: 0.75
  resume_reentry:
    enabled: false
    trigger: buffered
    risk_cap: 0.0
    disarm_other: true
  confirm_two_closes:
    enabled: false
  confirm_breakout:
    enabled: false          # LEAVE OFF. Re-measured 2026-08-20 on the v3.9.17 rig (ahead_only true,
                            # all-runner, 11:30 cutoff), 2022-01-03..2026-08-19 @60sh after $0.10:
                            #   A1 33,445->30,463 (-8.9%)   B1 37,699->34,784 (-7.7%)
                            #   C1 37,242->32,441 (-12.9%)  D1 33,417->25,205 (-24.6%)
                            # The win rate RISES (B1 46.4->48.4%) on ~170 fewer trades -- it removes
                            # winners with the losers. Regime bet: wins 2025 on all four, loses 2023
                            # AND 2026 on all four, 1-2 of 5 years only. Breadth ~270 up / ~660 down
                            # and ex-top-3 is negative on all four. The pre-2026-07-11 rationale
                            # ("net-negative under the resting stop") went stale when B1/C1 adopted
                            # stop_fill_mode: close three days later; these numbers replace it.
    require_trend_candle: true
    hold_bars: 1
  pdh_pdl_filter:
    enabled: false
    proximity_pct: 14.0
  pd_level_exit:            # ADOPTED 2026-08-10; added to D1 2026-08-11 after the v3.9.6 TV validation
    enabled: true           # found this file was the odd one out  the TV chart runs D1 with the rule
    levels: [pdO, pdH, pdL, pdC]   # ON while forward_test.py loaded this yaml with it silently OFF.
    ahead_only: false       # D1-ONLY REVERT 2026-08-21 -- v3.9.17 shipped this TRUE house-wide,
                            # but D1 is the one profile where it was already flagged the weakest
                            # case (see the v3.9.17 rig numbers below) and the user's own TV compare
                            # of the v3.9.11 vs v3.9.17 D1 exports found v3.9.11 (ahead_only false)
                            # reading better net/WR/PF. That matches the record, not a fluke:
                            #   D1 aggregate gain from true was only +1.0% ($33,082 -> $33,417),
                            #   vs +4.2-5.6% for A1/B1/C1 -- by far the thinnest of the four.
                            #   D1 is the ONLY profile that fails the ex-top-3 robustness check
                            #   (true vs false delta -$1,006).
                            #   D1 LOSES net in 2024, 2025, AND 2026 under true -- three of five
                            #   years -- so the whole +1.0% is carried by 2022+2023 alone; any TV
                            #   compare that isn't the full 2022-2026 window (or runs mismatched
                            #   slippage between the two chart versions) will show v3.9.11 ahead.
                            # A1/B1/C1 KEEP ahead_only true -- their gain is larger and consistent
                            # (wins the fit window, both OOS years and the 2026 holdout together).
                            # This is now per-profile, same pattern as D1's own adaptive_tp_scale
                            # 0.75 (see d1-tp-scale-075-and-1130-cutoff.md) -- one Pine "Profile"
                            # dropdown, one Python config file per profile, so the two knobs the
                            # profiles disagree on both branch off `isD1` rather than living as a
                            # single global switch. Revert to house-wide true = set this back to
                            # true (matches A1/B1/C1) and drop the isD1 branch in Pine's `effAhead`.
    zone: 0.05
    require_reject_candle: true
    max_body_frac: 0.25     # Engine sweep on D1 2022-2026 (per unit): off 450.5 -> 0.10 +4.9% /
                            # 0.15 +7.2% / 0.20 +7.0% / 0.25 +7.8% / 0.30 +0.6%. Flat plateau with
                            # 0.25 at the top, so D1 keeps the shipped knob (an earlier note claiming
                            # D1 wanted 0.15 does not survive the sweep). Weakest of the four profiles
                            # (+7.8% vs C1 +25.0 / B1 +21.1 / A1 +10.6), up in 3 of 5 years.
    in_profit_only: false
data:
  provider: fmp
  cache_dir: data/cache
  db_path: data/udb_orb.db
alerts:
  enabled: true
  channels:
  - email
  - webhook
  events:
  - primary_entry
  - reversal_entry
  - be_retrace_fired
  - tp_full
  - partial_exit
  - be_trail_exit
  - be_stop_exit
  - vwap_cross_exit
  - base_sl_exit
  - eod_exit
  - runner_trail_exit  # added 2026-08-19: fired but never alerted
  - pd_level_exit      # added 2026-08-19: fired but never alerted
live:
  poll_seconds: 30
  lookback_days: 3
