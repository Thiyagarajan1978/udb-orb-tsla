# TSLA BEST-A (RECOMMENDED): current default with confirm_breakout OFF.
# Confirmation was tuned under close-fill; under the resting stop it is net-negative
# (the resting stop already caps whipsaws at $5). Keeps runner-trail + all risk controls.
# 3yr (touch, $0.10 slip): 638 tr, 47.8% WR, +$469/unit. See BE_STOP_ANALYSIS.
symbol: TSLA
timeframe_minutes: 5
timezone: America/New_York
execution:
  stop_fill_mode: close   # ADOPTED 2026-07-15: CLOSE-triggered stop (fires only when the bar CLOSES beyond the level, fills at the close; TP stays wick-favorable). Same close-stop model adopted for the traded B1/C1 (walk-forward: +42-46% net, DD -40%, 2024 flips green over 2022-2026). A1 is not traded but kept consistent with the v3 indicator (exitOnClose default ON).
  exit_on_close: true
  protective_stop: false
  daily_loss_limit: 0.0
session:
  rth_start: 09:30
  rth_end: '16:00'
  market_open: 09:30
  eod_exit: '15:50'
profile:
  name: Adaptive TP + Reversal (Best Combined)
  trade_qty: 1.0
  slippage_per_unit: 0.1
  use_breakout_buffer: true
  buffer_pct_or: 10.0
  sl_mode: Candle High/Low + Max Cap
  sl_offset: 0.0
  fixed_sl: 5.0
  tp_mode: Adaptive
  adaptive_tp_scale: 1.0
  adaptive_tp_min: 2.14
  fixed_tp: 2.14
  use_be_retrace: true
  be_retrace_trigger: 0.55
  be_trail_amount: 0.25
  be_retrace_use_close: false
  use_partial_exit: true
  partial_qty_pct: 0.0
  # ADOPTED 2026-08-20 (Pine v3.9.16 "All-runner exit", ticked by default). 0.0 = the adaptive
  # TP takes NOTHING -- its touch only ARMS the runner and 100% exits on ONE runner exit, which is
  # what D1 has shipped since 2026-07-23. Measured 2022-01-03..2026-08-19 @60 shares:
  # A1 $28,450 -> $31,664 (+11.3%), past 3 years +12.3%. Better in the 2022-23 OOS years, the 2024-25 fit window AND
  # the 2026 holdout at once, net/DD up, trade count IDENTICAL (quantity changes, not signals).
  # COST, stated: win rate falls (A1 46.8 -> 45.6%) because the banked partial no longer rescues a marginal
  # trade, and the day-level delta on B1 is 160 up / 185 DOWN for +71.1/unit (ex-top-3 +56.7) --
  # bigger winners, MORE red days; maxDD slightly deeper on B1/C1. Set back to 25.0 for the
  # pre-2026-08-20 behaviour. NOT the same as use_partial_exit: false (100% AT the target), which
  # is 34-42% WORSE on every profile -- see docs and [[partial-exit-value-v32-toggle]].
  partial_activation: 1.0
  use_reversal: true
  reversal_qty_mult: 2.0
  reversal_target: 5.0
  apply_be_to_reversal: true
  reversal_risk_cap: 6.0
  reversal_risk_mode: scale
  min_or_width_enabled: false
  min_or_width: 2.5
  max_or_width_enabled: true
  max_or_width: 8.0
  use_vwap_filter: false
  trade_side_mode: Both
enhancements:
  rvol_filter:
    enabled: false
    lookback_bars: 20
    min_rvol: 1.2
  volatility_regime:
    enabled: true
    lookback: 20
    max_rvol_pct: 4.92
  or_width_regime:
    enabled: false
    skip_below: 0.0
    skip_above: 0.0
  time_window:            # ADOPTED 2026-07-26 @12:00: no NEW entries (primary or reversal) after the
    enabled: true         # cutoff; open positions still manage to their normal exits. Post-noon
    start: 09:35          # entries were a net-NEGATIVE cohort (lunch-hour chop); WR up in every
    end: '11:30'          # tested year-cell A1/B1/C1/D1 incl 2022-23 OOS. Pine 'Entry cutoff' = twin.
                          # TIGHTENED 2026-08-20 to 11:30 house-wide (D1 first @cd545a5). 11:30-12:00
                          # is itself a losing half hour over 2022-2026 -- B1 23 entries avg -0.52
                          # /unit, C1 24 entries -0.46 -- against 11:00-11:30 at +0.54 / +0.50. Lifts
                          # fit(2024-25), OOS(2022-23) and holdout(2026) at once on every profile;
                          # PF falls monotonically the later the cutoff sits (B1 1.37 -> 1.27 none).
                          # 2022-01-03..2026-08-11 /unit: B1 500.9 -> 525.1, C1 493.3 -> 515.9,
                          # A1 446.8 -> 471.0; B1 maxDD -80.9 -> -63.8, net/DD 6.19 -> 8.23.
                          # LIMITS: 2023 gets WORSE (B1 -10.1/unit). Breadth 29 days, 19 up / 10 down,
                          # ex-top-3 +10.1 -- but 10:30 and 11:00 both FAIL that same ex-top-3 test,
                          # so 11:30 is a spike on that column, not a plateau. Over the last 365 days
                          # alone it is ~flat (+1.1% B1, +0.4% C1).
  reversal_capture:
    enabled: true
    trigger_on_be_stop: true
    trail_to_eod: true
    target_or_mult: 0.0
    reenter_after_whipsaw: false
  runner_trail:
    enabled: true
    or_mult: 0.75
  resume_reentry:
    enabled: false
    trigger: buffered
    risk_cap: 0.0
    disarm_other: true
  confirm_two_closes:
    enabled: false
  confirm_breakout:
    enabled: false
    require_trend_candle: true
    hold_bars: 1
  pdh_pdl_filter:
    enabled: false
    proximity_pct: 14.0
  pd_level_exit:            # ADOPTED 2026-08-10; added to A1 2026-08-11 after the v3.9.6 TV validation
    enabled: true           # found this file was missing the block — the TV chart runs A1 with the rule
    levels: [pdO, pdH, pdL, pdC]   # ON while forward_test.py loaded this yaml with it silently OFF.
    ahead_only: false               # A1 is the OPTIONS default profile, so the drift mattered most here.
                            # BOTH SIDES, adopted 2026-08-11 by user call AGAINST the measurement:
                            # A1 485.6 vs 502.0 per unit, worse in 4 of 5 years. Revert = true.
    zone: 0.05
    require_reject_candle: true
    max_body_frac: 0.25     # Engine A/B on A1 2022-2026: +10.6% per unit. TV v3.9.6 export reconciles
                            # at 98.8% identical entries and 91% PD-fire concordance.
    in_profit_only: false
data:
  provider: fmp
  cache_dir: data/cache
  db_path: data/udb_orb.db
alerts:
  enabled: true
  channels:
  - email
  - webhook
  events:
  - primary_entry
  - reversal_entry
  - be_retrace_fired
  - tp_full
  - partial_exit
  - be_trail_exit
  - be_stop_exit
  - vwap_cross_exit
  - base_sl_exit
  - eod_exit
  - runner_trail_exit  # added 2026-08-19: fired but never alerted
  - pd_level_exit      # added 2026-08-19: fired but never alerted
live:
  poll_seconds: 30
  lookback_days: 3
